<title>Chorus Desktop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: AI-chat desktop app — sidebar | chat (home greeting or thread) | artifact panel when open. Bell menu holds approvals. */
:root {
  --bg: #FAF9F5;
  --sidebar: #F4F2EC;
  --surface: #FFFFFF;
  --bubble: #F0EEE6;
  --hover: #ECE9E0;
  --ink: #141413;
  --ink-2: #3D3D3A;
  --muted: #73726C;
  --faint: #A09E96;
  --line: #E5E2D9;
  --accent: #D97757;
  --accent-strong: #C6613F;
  --accent-ink: #FFFFFF;
  --accent-soft: #F7E8E1;
  --claude: #C6613F; --claude-soft: #F7E8E1;
  --agy: #3F6FD1; --agy-soft: #E4ECFA;
  --codex: #1F7F6E; --codex-soft: #DDEFEA;
  --ok: #3B7A47; --ok-soft: #E3EFE3;
  --warn: #996312; --warn-soft: #F7EDD7;
  --bad: #B13B32; --bad-soft: #F7E1DD;
  --site: #A8476E; --site-soft: #F6E5EC;
  --shadow-sm: 0 1px 2px rgba(20, 20, 19, .05);
  --shadow: 0 2px 6px rgba(20, 20, 19, .04), 0 12px 32px rgba(20, 20, 19, .08);
  --scrim: rgba(20, 20, 19, .35);

  --f-sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --sidebar: #1F1E1D; --surface: #30302E; --bubble: #141413; --hover: #353532;
    --ink: #F5F4EE; --ink-2: #DAD8D0; --muted: #A6A39A; --faint: #7D7A72; --line: #3C3B38;
    --accent: #D97757; --accent-strong: #E08A6B; --accent-ink: #FFFFFF; --accent-soft: #46302A;
    --claude: #E08A6B; --claude-soft: #46302A; --agy: #88A9EE; --agy-soft: #263250; --codex: #6CC5B1; --codex-soft: #1F3B36;
    --ok: #88C591; --ok-soft: #243826; --warn: #E5B562; --warn-soft: #3D3119; --bad: #EE8A80; --bad-soft: #452523;
    --site: #E79AB9; --site-soft: #42283A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 2px 6px rgba(0,0,0,.25), 0 12px 32px rgba(0,0,0,.35); --scrim: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262624; --sidebar: #1F1E1D; --surface: #30302E; --bubble: #141413; --hover: #353532;
  --ink: #F5F4EE; --ink-2: #DAD8D0; --muted: #A6A39A; --faint: #7D7A72; --line: #3C3B38;
  --accent: #D97757; --accent-strong: #E08A6B; --accent-ink: #FFFFFF; --accent-soft: #46302A;
  --claude: #E08A6B; --claude-soft: #46302A; --agy: #88A9EE; --agy-soft: #263250; --codex: #6CC5B1; --codex-soft: #1F3B36;
  --ok: #88C591; --ok-soft: #243826; --warn: #E5B562; --warn-soft: #3D3119; --bad: #EE8A80; --bad-soft: #452523;
  --site: #E79AB9; --site-soft: #42283A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 2px 6px rgba(0,0,0,.25), 0 12px 32px rgba(0,0,0,.35); --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 15px; height: 15px; }

/* ---------- Page around the mockup ---------- */
.page { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.intro { display: flex; flex-direction: column; gap: 4px; }
.intro h1 { margin: 0; font-family: var(--f-serif); font-weight: 400; font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -.01em; }
.intro p { margin: 0; color: var(--muted); max-width: 72ch; }
.scenarios { display: flex; flex-wrap: wrap; gap: 6px; }
.scn { display: inline-flex; gap: 8px; align-items: baseline; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--ink-2); }
.scn small { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.scn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.scn[aria-pressed="true"] small { color: var(--bg); opacity: .6; }

/* ---------- Window ---------- */
.window { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); position: relative; background: var(--bg); }
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr) auto; height: 760px; }

/* Sidebar */
.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 10px 8px; gap: 2px; }
.sb-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 10px; }
.wordmark { font-family: var(--f-serif); font-size: 21px; font-weight: 400; letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 8px; }
.glyph { display: inline-grid; grid-template-columns: repeat(3, 4px); gap: 2.5px; align-items: end; height: 16px; }
.glyph b { display: block; background: var(--accent); border-radius: 2px; }
.glyph b:nth-child(1) { height: 8px; } .glyph b:nth-child(2) { height: 16px; } .glyph b:nth-child(3) { height: 11px; }
.ghost-icon { width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
.ghost-icon:hover { background: var(--hover); color: var(--ink); }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: 0; background: none; text-align: left; width: 100%; color: var(--ink-2); font-size: 14px; }
.nav:hover { background: var(--hover); }
.nav[aria-current="page"] { background: var(--hover); color: var(--ink); }
.nav.new { color: var(--accent-strong); font-weight: 500; }
.nav.new .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-left: -2px; }
.nav.new .plus svg { width: 15px; height: 15px; stroke-width: 2; }
.sb-label { font-size: 12px; color: var(--muted); padding: 16px 10px 4px; font-weight: 500; }
.recents { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 1px; }
.recent { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); font-size: 13.5px; }
.recent span:first-child { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent:hover { background: var(--hover); }
.recent.on { background: var(--hover); color: var(--ink); }
.recent .mark { width: 16px; height: 16px; font-size: 9px; border-radius: 4px; opacity: .85; }
.me { display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; border-top: 1px solid var(--line); margin-top: 6px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--ink-2); color: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.me span { display: flex; flex-direction: column; line-height: 1.25; font-size: 13.5px; }
.me small { color: var(--muted); font-size: 12px; }

.mark { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
.m-claude { background: var(--claude-soft); color: var(--claude); }
.m-agy { background: var(--agy-soft); color: var(--agy); }
.m-codex { background: var(--codex-soft); color: var(--codex); }
.mark.lg { width: 40px; height: 40px; border-radius: 10px; font-size: 16px; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 52px; }
.title-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 5px 8px; border-radius: 8px; font-size: 14px; color: var(--ink); font-weight: 500; min-width: 0; }
.title-btn:hover { background: var(--hover); }
.top-right { margin-left: auto; display: flex; gap: 4px; align-items: center; position: relative; }
.bell { position: relative; width: 34px; height: 34px; border-radius: 9px; border: 0; background: none; color: var(--ink-2); display: grid; place-items: center; }
.bell:hover, .bell[aria-expanded="true"] { background: var(--hover); }
.badge { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 600; display: grid; place-items: center; border: 2px solid var(--bg); }

/* Home */
.home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px 80px; gap: 26px; overflow-y: auto; }
.greet { display: flex; align-items: center; gap: 14px; }
.greet .glyph { grid-template-columns: repeat(3, 7px); gap: 4px; height: 30px; }
.greet .glyph b:nth-child(1) { height: 15px; } .greet .glyph b:nth-child(2) { height: 30px; } .greet .glyph b:nth-child(3) { height: 21px; }
.greet h2 { margin: 0; font-family: var(--f-serif); font-weight: 300; font-size: clamp(30px, 4.2vw, 42px); letter-spacing: -.015em; line-height: 1.1; text-wrap: balance; }
.home .composer { width: 100%; max-width: 680px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 680px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink-2); font-size: 13.5px; }
.chip:hover { background: var(--hover); }

/* Thread */
.thread { flex: 1; overflow-y: auto; min-height: 0; }
.thread-inner { max-width: 740px; margin: 0 auto; padding: 12px 28px 24px; display: flex; flex-direction: column; gap: 22px; }
.u-msg { align-self: flex-end; max-width: 82%; background: var(--bubble); border-radius: 14px; padding: 10px 16px; font-size: 15.5px; line-height: 1.55; }
.a-msg { display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.65; color: var(--ink); }
.a-msg p { margin: 0; }
.by { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.by .mark { width: 20px; height: 20px; font-size: 10px; border-radius: 5px; }
.tools { align-self: flex-start; border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.tools:hover { color: var(--ink); }
.tools svg { transition: transform .15s; }
.tools[aria-expanded="true"] svg { transform: rotate(90deg); }
.tool-list { margin: -4px 0 0; padding: 4px 14px; list-style: none; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 14px; }
.art { align-self: flex-start; display: flex; align-items: center; gap: 14px; padding: 12px 18px 12px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); text-align: left; min-width: 0; max-width: 100%; box-shadow: var(--shadow-sm); }
.art:hover { border-color: var(--faint); }
.art .thumb { width: 52px; height: 40px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); flex: none; }
.art span.t { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.art strong { font-weight: 500; font-size: 14.5px; }
.art small { color: var(--muted); font-size: 13px; }
.pending { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; box-shadow: var(--shadow-sm); flex-wrap: wrap; max-width: 100%; text-align: left; }
div.pending { padding-right: 14px; flex-wrap: nowrap; }
.pending .dotw { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: pulse 1.4s infinite; flex: none; }
.pending.ok .dotw { background: var(--ok); animation: none; }
.pending.no .dotw { background: var(--bad); animation: none; }
.pending .muted { color: var(--muted); }
@keyframes pulse { 50% { opacity: .35; } }
.handoff-div { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.handoff-div::before, .handoff-div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.handoff-div span { display: inline-flex; gap: 8px; align-items: center; text-align: center; }
.told { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 13.5px; }
.told summary { cursor: pointer; padding: 9px 14px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
.told summary::-webkit-details-marker { display: none; }
.told[open] summary svg { transform: rotate(90deg); }
.told pre { margin: 0; padding: 0 14px 12px; font-family: var(--f-sans); white-space: pre-wrap; color: var(--ink-2); line-height: 1.6; }
.thinking { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.thinking .glyph b { animation: bars 1s ease-in-out infinite; transform-origin: bottom; }
.thinking .glyph b:nth-child(2) { animation-delay: .15s; } .thinking .glyph b:nth-child(3) { animation-delay: .3s; }
@keyframes bars { 50% { transform: scaleY(.45); } }

/* Composer */
.dock { padding: 0 24px 18px; }
.dock .composer, .limit { max-width: 740px; margin-inline: auto; }
.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 12px 10px 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.composer textarea { border: 0; outline: none; background: none; resize: none; min-height: 28px; max-height: 160px; font-size: 16px; line-height: 1.5; padding: 0; }
.composer textarea::placeholder { color: var(--faint); }
.composer label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.c-row { display: flex; align-items: center; gap: 6px; }
.c-icon { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
.c-icon:hover { background: var(--hover); color: var(--ink); }
.picker { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border-radius: 8px; border: 0; background: none; color: var(--ink-2); font-size: 14px; white-space: nowrap; min-width: 0; }
.picker:hover, .picker[aria-expanded="true"] { background: var(--hover); }
.picker .mark { width: 18px; height: 18px; font-size: 9.5px; border-radius: 5px; }
.picker .lbl { overflow: hidden; text-overflow: ellipsis; }
.send { width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send:hover { background: var(--accent-strong); }
.send[disabled] { opacity: .45; cursor: default; }

/* Agent menu */
.menu { position: absolute; right: 8px; width: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 20; display: flex; flex-direction: column; }
.menu.up { bottom: calc(100% + 6px); }
.menu.down { top: calc(100% + 6px); }
.mi { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 9px; border: 0; background: none; text-align: left; width: 100%; }
.mi:hover { background: var(--hover); }
.mi .t { display: flex; flex-direction: column; line-height: 1.3; flex: 1; min-width: 0; }
.mi .t strong { font-weight: 500; font-size: 14px; }
.mi .t small { color: var(--muted); font-size: 12.5px; }
.mi .tick { color: var(--accent-strong); display: grid; }
.tag { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag-install { background: var(--accent-soft); color: var(--accent-strong); }
.tag-limit { background: var(--warn-soft); color: var(--warn); }
.menu-foot { font-size: 12px; color: var(--muted); padding: 8px 10px 4px; border-top: 1px solid var(--line); margin-top: 4px; }

/* Usage limit */
.limit { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-sm); }
.limit-head { display: flex; gap: 12px; align-items: flex-start; }
.limit-head p { margin: 0; font-size: 14.5px; font-weight: 500; }
.limit-head p small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; font-weight: 400; }
.limit .btns { padding-left: 34px; }

/* Buttons */
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { height: 34px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn-dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn-dark:hover { background: var(--ink-2); }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-accent:hover { background: var(--accent-strong); }
.btn-danger { background: var(--bad); color: #FFFFFF; border-color: var(--bad); }
.btn-plain { border-color: transparent; background: none; color: var(--muted); }
.btn-plain:hover { color: var(--ink); background: var(--hover); }
.btn .mark { width: 18px; height: 18px; font-size: 9.5px; border-radius: 5px; }

/* Notifications */
.notif { position: absolute; right: 0; top: calc(100% + 6px); width: 390px; max-height: 560px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); z-index: 25; }
.notif-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.notif-head strong { font-size: 15px; font-weight: 600; }
.notif-sec { font-size: 12px; color: var(--muted); padding: 8px 14px 4px; font-weight: 500; }
.n { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.n.focus { background: var(--accent-soft); }
.n-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.n-meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.n-title { font-weight: 500; font-size: 14.5px; line-height: 1.35; }
.n-text { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.risk { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
.n details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
.code { font-family: var(--f-mono); font-size: 12px; background: var(--bubble); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; margin-top: 6px; }
.n-done { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.n-done.ok { color: var(--ok); } .n-done.no { color: var(--bad); }
.unread { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* Artifact panel */
.panel { width: min(46vw, 560px); border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.p-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
.p-head .t { display: flex; flex-direction: column; line-height: 1.25; flex: 1; min-width: 0; }
.p-head strong { font-weight: 500; }
.p-head small { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 500; }

<div class="page">
  <header class="intro">
    <h1>Chorus desktop app</h1>
    <p>Start a chat, pick which agent does the work, and switch to another one when you hit a usage limit. Pick a moment below; each matches a use case in <code>documents/ui-use-cases.md</code>.</p>
  </header>
  <div class="scenarios" id="scenarios" role="group" aria-label="Choose a moment"></div>
  <section class="window" id="window" aria-label="Chorus app window"><div id="root"></div></section>
</div>

<script>
(function () {
  const ICON = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    side: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/>',
    chats: '<path d="M7 18.5 3.5 21V6.5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z"/>',
    skills: '<path d="M12 3.5l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2z"/>',
    activity: '<path d="M3 12h4l3-7 4 14 3-7h4"/>',
    bell: '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
    up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
    chev: '<path d="M7 10l5 5 5-5"/>',
    right: '<path d="M10 7l5 5-5 5"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
    code: '<path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
    clip: '<path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15 7"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/>',
    bug: '<rect x="7.5" y="7" width="9" height="12" rx="4.5"/><path d="M12 11v8M4 13h3.5M16.5 13H20M5 8l2.5 1.5M19 8l-2.5 1.5M9 7a3 3 0 0 1 6 0"/>',
    term: '<rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M7.5 10l2.5 2-2.5 2M12.5 14.5h4"/>',
    ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>'
  };
  const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (s) => document.querySelector(s);
  const glyph = '<span class="glyph" aria-hidden="true"><b></b><b></b><b></b></span>';

  const AG = {
    claude: { name: 'Claude Code', l: 'C', tip: 'Great for building and fixing', install: 'npm install -g @anthropic-ai/claude-code', account: 'Claude' },
    agy: { name: 'Antigravity', l: 'A', tip: 'Great for planning big changes', install: '', account: 'Google' },
    codex: { name: 'Codex', l: 'X', tip: 'Great for testing and reviews', install: 'npm install -g @openai/codex', account: 'ChatGPT' }
  };
  const mark = (k, cls = '') => `<span class="mark m-${k} ${cls}" aria-hidden="true">${AG[k].l}</span>`;

  const SCN = [
    { id: 'home', label: 'New chat', uc: 'UC-01' },
    { id: 'pick', label: 'Pick an agent', uc: 'UC-02' },
    { id: 'install', label: 'Agent not installed', uc: 'UC-03' },
    { id: 'chat', label: 'Chatting', uc: 'UC-04, 06' },
    { id: 'bell', label: 'Approvals in the bell', uc: 'UC-05' },
    { id: 'limit', label: 'Usage limit, hand off', uc: 'UC-07' },
    { id: 'skills', label: 'Skills', uc: 'UC-09' },
    { id: 'activity', label: 'Activity', uc: 'UC-10' }
  ];

  const freshNotifs = () => ([
    { id: 'n1', type: 'approval', agent: 'claude', chat: 'Cake order page', time: 'Just now', title: 'Set up storage for cake orders',
      text: 'Adds an "Orders" table to your website\'s database. Your menu and customer list aren\'t changed.', cmd: 'npx prisma migrate dev --name add_orders', status: 'pending' },
    { id: 'n2', type: 'approval', agent: 'codex', chat: 'Fix the contact form', time: '4 min ago', risky: true, title: 'Delete 214 old build files',
      text: 'Removes the "dist" folder. It\'s rebuilt automatically; your own work isn\'t touched.', cmd: 'rm -rf ./dist', status: 'pending' },
    { id: 'n3', type: 'info', agent: 'agy', chat: 'Holiday landing page', time: '12 min ago', title: 'Antigravity finished the holiday landing page', unread: true }
  ]);
  const freshSkills = () => ([
    { id: 's1', name: 'Brand style', desc: 'Use our rose and cream colors and the bakery logo on every page.', src: 'Made in Chorus', on: true, sync: { claude: true, agy: true, codex: true } },
    { id: 's2', name: 'Friendly copy', desc: 'Write short, warm sentences for customers. No jargon.', src: 'Made in Chorus', on: true, sync: { claude: true, agy: true, codex: true } },
    { id: 's3', name: 'Phone check', desc: 'After changing a page, check it on a phone-size screen. Includes a script.', src: 'From Claude Code', on: true, sync: { claude: true, agy: false, codex: true } },
    { id: 's4', name: 'Stripe payments', desc: 'How to add card payments, using test keys first.', src: 'From Antigravity', on: false, sync: { claude: false, agy: true, codex: false } }
  ]);
  const FOUND = [
    { id: 'f1', name: 'Test before done', desc: 'Run the tests before saying a task is finished.' },
    { id: 'f2', name: 'Image shrinker', desc: 'Makes photos smaller before adding them to the site.' }
  ];

  const S = {};
  function reset(id) {
    const homeLike = id === 'home' || id === 'pick' || id === 'install';
    Object.assign(S, {
      scenario: id, view: 'chat', screen: homeLike ? 'home' : 'thread', agent: 'claude', menu: id === 'pick', bell: false,
      modal: id === 'install' ? 'install' : null, modalAgent: 'codex', installStep: 0, installing: false,
      installed: { claude: true, agy: true, codex: !homeLike },
      notifs: freshNotifs(), riskyConfirm: null, focusNotif: null, artifact: id === 'chat' ? 'order' : null, artTab: 'preview', toolsOpen: false,
      limited: id === 'limit', handedTo: null, extra: [], skills: freshSkills(), found: FOUND.slice(), foundPick: { f1: true, f2: true },
      skillEdit: null, actTab: 'timeline', fresh: false
    });
    if (id === 'bell') { S.bell = true; S.focusNotif = 'n1'; }
    if (id === 'limit') S.notifs[0].status = 'allowed';
    if (id === 'skills') S.view = 'skills';
    if (id === 'activity') S.view = 'activity';
    render();
  }

  const pendingCount = () => S.notifs.filter((n) => n.type === 'approval' && n.status === 'pending').length;

  /* ---------- Sidebar ---------- */
  function sidebarHTML() {
    const onThread = S.view === 'chat' && S.screen === 'thread';
    const recents = [
      ['Cake order page', S.handedTo || 'claude', onThread, true],
      ['Fix the contact form', 'codex'], ['Holiday landing page', 'agy'], ['Menu colors', 'claude'], ['Write the About page', 'claude'], ['Gift card idea', 'agy']
    ];
    return `<aside class="sidebar">
      <div class="sb-head"><span class="wordmark">${glyph}Chorus</span><button class="ghost-icon" type="button" aria-label="Hide sidebar" data-toast="Hides the sidebar.">${ic('side')}</button></div>
      <button class="nav new" type="button" data-new-chat><span class="plus">${ic('plus')}</span>New chat</button>
      <button class="nav" type="button" data-view="chat" ${S.view === 'chat' ? 'aria-current="page"' : ''}>${ic('chats')}Chats</button>
      <button class="nav" type="button" data-view="skills" ${S.view === 'skills' ? 'aria-current="page"' : ''}>${ic('skills')}Skills</button>
      <button class="nav" type="button" data-view="activity" ${S.view === 'activity' ? 'aria-current="page"' : ''}>${ic('activity')}Activity</button>
      <div class="sb-label">Recents</div>
      <div class="recents">${recents.map(([t, a, on, open]) => `<button class="recent ${on ? 'on' : ''}" type="button" ${open ? 'data-open-chat' : 'data-toast="Opens this chat."'}><span>${t}</span>${mark(a)}</button>`).join('')}</div>
      <div class="me"><span class="avatar">L</span><span>Linh<small>Sweet Crumb Bakery</small></span></div>
    </aside>`;
  }

  function topbarHTML(title) {
    const n = pendingCount();
    return `<div class="topbar">
      <button class="ghost-icon mobile-menu" type="button" aria-label="Menu" data-toast="Opens the sidebar.">${ic('menu')}</button>
      ${title ? `<button class="title-btn" type="button" data-toast="Rename, star or delete this chat."><span>${esc(title)}</span>${ic('chev', 'sm')}</button>` : ''}
      <div class="top-right">
        <button class="bell" type="button" id="bell" aria-label="Notifications${n ? `, ${n} waiting for approval` : ''}" aria-expanded="${S.bell}">${ic('bell')}${n ? `<span class="badge">${n}</span>` : ''}</button>
        ${S.bell ? notifHTML() : ''}
      </div>
    </div>`;
  }

  /* ---------- Notifications ---------- */
  function notifHTML() {
    const appr = S.notifs.filter((n) => n.type === 'approval');
    const info = S.notifs.filter((n) => n.type === 'info');
    const row = (n) => {
      let actions;
      if (n.type === 'approval') {
        if (n.status === 'allowed') actions = `<span class="n-done ok">${ic('check', 'sm')} Allowed</span>`;
        else if (n.status === 'denied') actions = `<span class="n-done no">${ic('x', 'sm')} Not allowed</span>`;
        else if (S.riskyConfirm === n.id) actions = `<p class="n-text" style="color:var(--bad)">This can't be undone. Delete 214 files?</p><div class="btns"><button class="btn sm btn-danger" type="button" data-decide="${n.id}:allowed">Yes, delete 214 files</button><button class="btn sm" type="button" data-unconfirm>Cancel</button></div>`;
        else actions = `<div class="btns"><button class="btn sm btn-dark" type="button" data-decide="${n.id}:${n.risky ? 'confirm' : 'allowed'}">Allow</button><button class="btn sm" type="button" data-decide="${n.id}:denied">Don't allow</button>${n.id === 'n1' ? '<button class="btn sm btn-plain" type="button" data-open-chat>Go to chat</button>' : ''}</div>`;
      } else actions = `<div class="btns"><button class="btn sm" type="button" data-toast="Opens the Holiday landing page chat.">Open chat</button></div>`;
      return `<div class="n ${S.focusNotif === n.id ? 'focus' : ''}">
        ${mark(n.agent)}
        <div class="n-body">
          <span class="n-meta">${n.unread ? '<span class="unread" aria-label="Unread"></span>' : ''}${AG[n.agent].name} · ${esc(n.chat)} · ${n.time}${n.risky ? ' <span class="risk">Risky</span>' : ''}</span>
          <span class="n-title">${esc(n.title)}</span>
          ${n.text ? `<p class="n-text">${esc(n.text)}</p>` : ''}
          ${n.cmd ? `<details><summary>Show what will run</summary><div class="code">${esc(n.cmd)}</div></details>` : ''}
          ${actions}
        </div>
      </div>`;
    };
    return `<div class="notif" role="dialog" aria-label="Notifications">
      <div class="notif-head"><strong>Notifications</strong><button class="btn sm btn-plain" type="button" data-read-all>Mark all as read</button></div>
      ${appr.length ? `<div class="notif-sec">Waiting for your approval</div>${appr.map(row).join('')}` : ''}
      ${info.length ? `<div class="notif-sec">Earlier</div>${info.map(row).join('')}` : ''}
    </div>`;
  }

  /* ---------- Composer + agent menu ---------- */
  function composerHTML(home) {
    const a = S.agent;
    const locked = S.limited && !S.handedTo;
    return `<form class="composer" id="composer">
      <label class="sr" for="prompt">Message</label>
      <textarea id="prompt" rows="${home ? 2 : 1}" ${locked ? 'disabled' : ''} placeholder="${home ? 'What do you want to build today?' : locked ? 'Pick an agent above to keep going' : `Reply to ${AG[a].name}…`}"></textarea>

Goal: Customers can order a birthday cake online and pick it up later.
Done: Order page and form, linked from the menu. Orders are saved.

  /* ---------- Install modal ---------- */
  function installModalHTML() {
    const k = S.modalAgent, st = S.installStep;
    const n = (i) => st > i ? `<span class="num done">${ic('check')}</span>` : `<span class="num ${st === i ? 'now' : ''}">${i + 1}</span>`;
    return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="in-t">
      <div class="modal-head">${mark(k, 'lg')}<div><h3 id="in-t">${st > 2 ? `${AG[k].name} is ready` : `${AG[k].name} isn't installed yet`}</h3><p>${st > 2 ? 'You can use it in this chat and any other.' : `${AG[k].name} runs on your computer. Install it once and use it in any chat.`}</p></div>
        <button class="ghost-icon" type="button" data-close-modal aria-label="Close">${ic('x')}</button></div>
      <ol class="steps">
        <li>${n(0)}<div class="s"><strong>Install</strong>
          ${st > 0 ? '<p>Installed.</p>' : S.installing ? '<p>Installing… this takes about a minute.</p><div class="bar"><i id="ibar"></i></div>' : `
          <div class="btns"><button class="btn btn-accent" type="button" id="do-install">Install for me</button></div>
          <p>Or paste this into Terminal:</p>
          <div class="copyrow"><div class="code">${esc(AG[k].install)}</div><button class="c-icon" type="button" data-copy="${esc(AG[k].install)}" aria-label="Copy command">${ic('copy', 'sm')}</button></div>`}
        </div></li>
        <li>${n(1)}<div class="s"><strong>Sign in with ${AG[k].account}</strong><p>A sign-in page opens in your browser.</p>
          ${st === 1 ? '<div class="btns"><button class="btn btn-accent" type="button" id="do-signin">Sign in</button></div>' : ''}</div></li>
        <li>${n(2)}<div class="s"><strong>Quick check</strong><p>${st === 2 ? 'Checking…' : st > 2 ? 'Everything works.' : 'Chorus makes sure it runs.'}</p></div></li>
      </ol>
      <div class="btns">${st > 2 ? `<button class="btn btn-dark" type="button" data-use="${k}">Use ${AG[k].name}</button>` : `<button class="btn btn-plain" type="button" data-close-modal>Not now</button>`}</div>
    </div></div>`;
  }

  /* ---------- Render ---------- */
  function render() {
    $('#scenarios').innerHTML = SCN.map((s) => `<button class="scn" type="button" data-scn="${s.id}" aria-pressed="${s.id === S.scenario}"><small>${s.uc}</small>${s.label}</button>`).join('');
    const main = S.view === 'skills' ? skillsHTML() : S.view === 'activity' ? activityHTML() : S.screen === 'home' ? homeHTML() : threadHTML();
    const modal = S.modal === 'install' ? installModalHTML() : S.modal === 'skill' ? skillModalHTML() : '';
    $('#root').innerHTML = `<div class="app">${sidebarHTML()}${main}${panelHTML()}</div>${modal}`;
    const t = $('#thread'); if (t && !S.keep) t.scrollTop = t.scrollHeight;
    S.keep = false;
    if (S.installing) requestAnimationFrame(() => { const b = $('#ibar'); if (b) b.style.width = '100%'; });
  }
  const rerender = () => { S.keep = true; render(); };

  let tt;
  function toast(text) {
    let el = $('#toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); $('#window').appendChild(el); }
    el.textContent = text; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 2600);
  }

  function chooseAgent(k) {
    S.menu = false;
    if (!S.installed[k]) { S.modal = 'install'; S.modalAgent = k; S.installStep = 0; return rerender(); }
    if (S.screen === 'thread' && k !== S.agent) {
      if (S.limited && !S.handedTo) return handoff(k);
      S.extra.push({ t: 'switch', to: k }); toast(`${AG[k].name} has a summary of this chat.`);
    }
    S.agent = k; render();
  }
  function handoff(k) { S.handedTo = k; S.agent = k; S.menu = false; render(); toast(`${AG[k].name} picked up where Claude Code left off.`); }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    let changed = false;
    if (S.menu && !e.target.closest('.menu') && !e.target.closest('#picker')) { S.menu = false; changed = true; }
    if (S.bell && !e.target.closest('.notif') && !e.target.closest('#bell') && !e.target.closest('[data-open-bell]')) { S.bell = false; S.focusNotif = null; changed = true; }
    if (!b) { if (changed) rerender(); return; }
    const d = b.dataset;
    if (d.scn) return reset(d.scn);
    if (d.toast) { if (changed) rerender(); return toast(d.toast); }
    if (d.copy) { try { navigator.clipboard.writeText(d.copy).then(() => toast('Copied.'), () => toast('Select the command to copy it.')); } catch (_) { toast('Select the command to copy it.'); } return; }
    if (b.id === 'picker') { S.menu = !S.menu; return rerender(); }
    if (d.agent) return chooseAgent(d.agent);
    if (b.id === 'bell') { S.bell = !S.bell; S.focusNotif = null; return rerender(); }
    if (d.openBell) { S.bell = true; S.focusNotif = d.openBell; return rerender(); }
    if (d.decide) {
      const [id, v] = d.decide.split(':'); const n = S.notifs.find((x) => x.id === id);
      if (v === 'confirm') { S.riskyConfirm = id; return rerender(); }
      n.status = v; S.riskyConfirm = null; rerender();
      return toast(v === 'allowed' ? `Allowed. ${AG[n.agent].name} is continuing.` : `${AG[n.agent].name} won't do that and will suggest another way.`);
    }
    if ('unconfirm' in d) { S.riskyConfirm = null; return rerender(); }
    if ('readAll' in d) { S.notifs.forEach((n) => { n.unread = false; }); return rerender(); }
    if ('openChat' in d) { S.view = 'chat'; S.screen = 'thread'; S.fresh = false; S.bell = false; return render(); }
    if ('newChat' in d) { S.view = 'chat'; S.screen = 'home'; S.fresh = false; S.extra = []; S.artifact = null; S.agent = 'claude'; return render(); }
    if (d.view) { S.view = d.view; S.menu = false; return render(); }
    if (d.fill) { const p = $('#prompt'); p.value = d.fill; p.focus(); return; }
    if (b.id === 'tools') { S.toolsOpen = !S.toolsOpen; return rerender(); }
    if (d.art) { S.artifact = d.art; S.artTab = 'preview'; return rerender(); }
    if (d.arttab) { S.artTab = d.arttab; return rerender(); }
    if ('closeArt' in d) { S.artifact = null; return rerender(); }
    if (d.handoff) return handoff(d.handoff);
    if ('closeModal' in d) { S.modal = null; S.installing = false; return rerender(); }
    if (b.id === 'do-install') { S.installing = true; rerender(); setTimeout(() => { S.installing = false; S.installStep = 1; rerender(); }, 1600); return; }
    if (b.id === 'do-signin') { toast('Opened the sign-in page in your browser.'); S.installStep = 2; rerender(); setTimeout(() => { S.installStep = 3; S.installed[S.modalAgent] = true; rerender(); }, 1200); return; }
    if (d.use) { S.modal = null; return chooseAgent(d.use); }
    if ('newSkill' in d) { S.modal = 'skill'; S.skillEdit = 'new'; return rerender(); }
    if (d.editSkill) { S.modal = 'skill'; S.skillEdit = d.editSkill; return rerender(); }
    if (d.sync) { const [id, k] = d.sync.split(':'); const s = S.skills.find((x) => x.id === id); s.sync[k] = !s.sync[k]; rerender(); return toast(`${s.name} ${s.sync[k] ? 'now syncs to' : 'no longer syncs to'} ${AG[k].name}.`); }
    if ('syncFound' in d) {
      const picked = S.found.filter((f) => S.foundPick[f.id]);
      picked.forEach((f) => S.skills.unshift({ id: f.id, name: f.name, desc: f.desc, src: 'From Codex', on: true, sync: { claude: true, agy: true, codex: S.installed.codex } }));
      S.found = S.found.filter((f) => !S.foundPick[f.id]); rerender(); return toast(`Shared ${picked.length} skill${picked.length === 1 ? '' : 's'}.`);
    }
    if ('dismissFound' in d) { S.found = []; return rerender(); }
    if (d.acttab) { S.actTab = d.acttab; return rerender(); }
    if (changed) rerender();
  });

  document.addEventListener('change', (e) => {
    const d = e.target.dataset;
    if (d.skillOn) { const s = S.skills.find((x) => x.id === d.skillOn); s.on = e.target.checked; rerender(); toast(s.on ? `${s.name} is on.` : `${s.name} is off. It's kept, so you can turn it back on.`); }
    if (d.found) S.foundPick[d.found] = e.target.checked;
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'composer') {
      const p = $('#prompt'); const t = p.value.trim(); if (!t) { p.focus(); return; }
      if (S.screen === 'home') { S.screen = 'thread'; S.fresh = true; S.extra = []; }
      S.extra.push({ t: 'user', text: t }, { t: 'agent', agent: S.agent }); return render();
    }
    if (e.target.id === 'skill-form') {
      const name = $('#sk-name').value.trim() || 'Untitled skill', desc = $('#sk-desc').value.trim() || 'No description yet.';
      const sync = {}; e.target.querySelectorAll('input[name="tgt"]').forEach((i) => { sync[i.value] = i.checked; });
      if (S.skillEdit === 'new') S.skills.unshift({ id: 'n' + Date.now(), name, desc, src: 'Made in Chorus', on: true, sync });
      else Object.assign(S.skills.find((x) => x.id === S.skillEdit), { name, desc, sync });
      S.modal = null; rerender(); toast(`Saved ${name}.`);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (S.modal) S.modal = null; S.menu = false; S.bell = false; rerender(); }
    if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'prompt') { e.preventDefault(); $('#composer').requestSubmit(); }
  });

  reset('home');
})();
</script>
