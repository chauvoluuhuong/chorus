<title>Chorus Desktop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: AI-chat desktop app — sidebar | chat or terminal | artifact panel when open. Bell menu holds approvals. */
:root {
  --bg: #FAF9F5;
  --sidebar: #F4F2EC;
  --surface: #FFFFFF;
  --bubble: #F0EEE6;
  --hover: #ECE9E0;
  --ink: #141413;
  --ink-2: #3D3D3A;
  --muted: #73726C;
  --faint: #A09E96;
  --line: #E5E2D9;
  --accent: #D97757;
  --accent-strong: #C6613F;
  --accent-ink: #FFFFFF;
  --accent-soft: #F7E8E1;
  --claude: #C6613F; --claude-soft: #F7E8E1;
  --agy: #3F6FD1; --agy-soft: #E4ECFA;
  --codex: #1F7F6E; --codex-soft: #DDEFEA;
  --ok: #3B7A47; --ok-soft: #E3EFE3;
  --warn: #996312; --warn-soft: #F7EDD7;
  --bad: #B13B32; --bad-soft: #F7E1DD;
  --add: #E6F2E6; --del: #F9E4E1;
  --site: #A8476E; --site-soft: #F6E5EC;
  --term-bg: #1C1B19; --term-fg: #E8E6DF; --term-dim: #8C897F; --term-line: #34332F;
  --term-green: #8FCB8F; --term-yellow: #E5C07B; --term-cyan: #7FC4D6; --term-red: #EE8A80; --term-clay: #E08A6B;
  --shadow-sm: 0 1px 2px rgba(20, 20, 19, .05);
  --shadow: 0 2px 6px rgba(20, 20, 19, .04), 0 12px 32px rgba(20, 20, 19, .08);
  --scrim: rgba(20, 20, 19, .35);

  --f-sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --sidebar: #1F1E1D; --surface: #30302E; --bubble: #141413; --hover: #353532;
    --ink: #F5F4EE; --ink-2: #DAD8D0; --muted: #A6A39A; --faint: #7D7A72; --line: #3C3B38;
    --accent: #D97757; --accent-strong: #E08A6B; --accent-ink: #FFFFFF; --accent-soft: #46302A;
    --claude: #E08A6B; --claude-soft: #46302A; --agy: #88A9EE; --agy-soft: #263250; --codex: #6CC5B1; --codex-soft: #1F3B36;
    --ok: #88C591; --ok-soft: #243826; --warn: #E5B562; --warn-soft: #3D3119; --bad: #EE8A80; --bad-soft: #452523;
    --add: #233826; --del: #452523;
    --site: #E79AB9; --site-soft: #42283A;
    --term-bg: #141413; --term-line: #2E2D2A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 2px 6px rgba(0,0,0,.25), 0 12px 32px rgba(0,0,0,.35); --scrim: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262624; --sidebar: #1F1E1D; --surface: #30302E; --bubble: #141413; --hover: #353532;
  --ink: #F5F4EE; --ink-2: #DAD8D0; --muted: #A6A39A; --faint: #7D7A72; --line: #3C3B38;
  --accent: #D97757; --accent-strong: #E08A6B; --accent-ink: #FFFFFF; --accent-soft: #46302A;
  --claude: #E08A6B; --claude-soft: #46302A; --agy: #88A9EE; --agy-soft: #263250; --codex: #6CC5B1; --codex-soft: #1F3B36;
  --ok: #88C591; --ok-soft: #243826; --warn: #E5B562; --warn-soft: #3D3119; --bad: #EE8A80; --bad-soft: #452523;
  --add: #233826; --del: #452523;
  --site: #E79AB9; --site-soft: #42283A;
  --term-bg: #141413; --term-line: #2E2D2A;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow: 0 2px 6px rgba(0,0,0,.25), 0 12px 32px rgba(0,0,0,.35); --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 15px; height: 15px; }
code, .mono { font-family: var(--f-mono); font-size: .9em; }

/* ---------- Page around the mockup ---------- */
.page { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.intro { display: flex; flex-direction: column; gap: 4px; }
.intro h1 { margin: 0; font-family: var(--f-serif); font-weight: 400; font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -.01em; }
.intro p { margin: 0; color: var(--muted); max-width: 76ch; }
.scenarios { display: flex; flex-wrap: wrap; gap: 6px; }
.scn { display: inline-flex; gap: 8px; align-items: baseline; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--ink-2); }
.scn small { font-family: var(--f-mono); font-size: 10.5px; color: var(--faint); }
.scn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.scn[aria-pressed="true"] small { color: var(--bg); opacity: .6; }

/* ---------- Window ---------- */
.window { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); position: relative; background: var(--bg); }
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr) auto; height: 780px; }

/* Sidebar */
.sidebar { background: var(--sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding: 10px 8px; gap: 2px; }
.sb-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 10px; }
.wordmark { font-family: var(--f-serif); font-size: 21px; font-weight: 400; letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 8px; }
.glyph { display: inline-grid; grid-template-columns: repeat(3, 4px); gap: 2.5px; align-items: end; height: 16px; }
.glyph b { display: block; background: var(--accent); border-radius: 2px; }
.glyph b:nth-child(1) { height: 8px; } .glyph b:nth-child(2) { height: 16px; } .glyph b:nth-child(3) { height: 11px; }
.ghost-icon { width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
.ghost-icon:hover { background: var(--hover); color: var(--ink); }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: 0; background: none; text-align: left; width: 100%; color: var(--ink-2); font-size: 14px; }
.nav:hover { background: var(--hover); }
.nav[aria-current="page"] { background: var(--hover); color: var(--ink); }
.nav.new { color: var(--accent-strong); font-weight: 500; }
.nav.new .plus { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-left: -2px; }
.nav.new .plus svg { width: 15px; height: 15px; stroke-width: 2; }
.sb-label { font-size: 12px; color: var(--muted); padding: 16px 10px 4px; font-weight: 500; }
.recents { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 1px; }
.recent { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); font-size: 13.5px; }
.recent span:first-child { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent:hover { background: var(--hover); }
.recent.on { background: var(--hover); color: var(--ink); }
.recent .mark { width: 16px; height: 16px; font-size: 9px; border-radius: 4px; opacity: .85; }
.sb-foot { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }

.mark { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
.m-claude { background: var(--claude-soft); color: var(--claude); }
.m-agy { background: var(--agy-soft); color: var(--agy); }
.m-codex { background: var(--codex-soft); color: var(--codex); }
.mark.lg { width: 40px; height: 40px; border-radius: 10px; font-size: 16px; }
.mark.xs { width: 16px; height: 16px; font-size: 9px; border-radius: 4px; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 52px; flex-wrap: wrap; }
.title-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 5px 8px; border-radius: 8px; font-size: 14px; color: var(--ink); font-weight: 500; min-width: 0; }
.title-btn:hover { background: var(--hover); }
.title-btn .sub { color: var(--muted); font-weight: 400; }
.top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; position: relative; }
.bell { position: relative; width: 34px; height: 34px; border-radius: 9px; border: 0; background: none; color: var(--ink-2); display: grid; place-items: center; }
.bell:hover, .bell[aria-expanded="true"] { background: var(--hover); }
.badge { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 600; display: grid; place-items: center; border: 2px solid var(--bg); }

/* Home */
.home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px 80px; gap: 26px; overflow-y: auto; }
.greet { display: flex; align-items: center; gap: 14px; }
.greet .glyph { grid-template-columns: repeat(3, 7px); gap: 4px; height: 30px; }
.greet .glyph b:nth-child(1) { height: 15px; } .greet .glyph b:nth-child(2) { height: 30px; } .greet .glyph b:nth-child(3) { height: 21px; }
.greet h2 { margin: 0; font-family: var(--f-serif); font-weight: 300; font-size: clamp(30px, 4.2vw, 42px); letter-spacing: -.015em; line-height: 1.1; text-wrap: balance; }
.home .composer { width: 100%; max-width: 680px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 680px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink-2); font-size: 13.5px; }
.chip:hover { background: var(--hover); }

/* Thread */
.thread { flex: 1; overflow-y: auto; min-height: 0; }
.thread-inner { max-width: 760px; margin: 0 auto; padding: 12px 28px 24px; display: flex; flex-direction: column; gap: 20px; }
.u-msg { align-self: flex-end; max-width: 82%; background: var(--bubble); border-radius: 14px; padding: 10px 16px; font-size: 15.5px; line-height: 1.55; }
.a-msg { display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.65; color: var(--ink); min-width: 0; }
.a-msg p { margin: 0; }
.by { align-self: flex-start; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.by .mark { width: 20px; height: 20px; font-size: 10px; border-radius: 5px; }
.by .model { font-weight: 400; color: var(--faint); }

/* Tool use */
.tools-sum { align-self: flex-start; border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; text-align: left; }
.tools-sum:hover { color: var(--ink); }
.tools-sum svg { transition: transform .15s; }
.tools-sum[aria-expanded="true"] svg.chev { transform: rotate(90deg); }
.tool-group { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; font-size: 13.5px; }
.tool { border-top: 1px solid var(--line); }
.tool:first-child { border-top: 0; }
.tool-row { display: grid; grid-template-columns: 18px auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; width: 100%; border: 0; background: none; text-align: left; }
.tool-row:hover { background: var(--hover); }
.tool-row .verb { font-weight: 500; color: var(--ink); }
.tool-row .target { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-row .meta { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.plus-n { color: var(--ok); } .minus-n { color: var(--bad); }
.st-ok { color: var(--ok); } .st-bad { color: var(--bad); } .st-wait { color: var(--warn); font-weight: 500; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.tool-detail { padding: 0 12px 12px 40px; display: flex; flex-direction: column; gap: 8px; }
.diff { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; line-height: 1.6; }
.diff div { padding: 0 10px; white-space: pre; }
.diff .a { background: var(--add); } .diff .d { background: var(--del); } .diff .h { color: var(--faint); background: var(--bubble); }
.out { font-family: var(--f-mono); font-size: 12px; background: var(--bubble); border-radius: 8px; padding: 8px 10px; white-space: pre; overflow-x: auto; color: var(--ink-2); line-height: 1.55; }
.tool-detail .links { display: flex; gap: 12px; font-size: 12.5px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent-strong); font-size: inherit; }
.linkish:hover { text-decoration: underline; }

.art { align-self: flex-start; display: flex; align-items: center; gap: 14px; padding: 12px 18px 12px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); text-align: left; min-width: 0; max-width: 100%; box-shadow: var(--shadow-sm); }
.art:hover { border-color: var(--faint); }
.art .thumb { width: 52px; height: 40px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); flex: none; }
.art span.t { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.art strong { font-weight: 500; font-size: 14.5px; }
.art small { color: var(--muted); font-size: 13px; }
.handoff-div { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.handoff-div::before, .handoff-div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.handoff-div span { display: inline-flex; gap: 8px; align-items: center; text-align: center; }
.told { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 13.5px; }
.told summary { cursor: pointer; padding: 9px 14px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
.told summary::-webkit-details-marker { display: none; }
.told[open] summary svg { transform: rotate(90deg); }
.told summary span.tok { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.told pre { margin: 0; padding: 0 14px 12px; font-family: var(--f-mono); font-size: 12px; white-space: pre-wrap; color: var(--ink-2); line-height: 1.6; }
.thinking { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.thinking .glyph b { animation: bars 1s ease-in-out infinite; transform-origin: bottom; }
.thinking .glyph b:nth-child(2) { animation-delay: .15s; } .thinking .glyph b:nth-child(3) { animation-delay: .3s; }
@keyframes bars { 50% { transform: scaleY(.45); } }

/* Terminal view */
.term { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 14px 14px; border-radius: 12px; overflow: hidden; background: var(--term-bg); color: var(--term-fg); border: 1px solid var(--term-line); }
.term-tabs { display: flex; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--term-line); overflow-x: auto; }
.term-tab { display: inline-flex; gap: 8px; align-items: center; padding: 7px 12px; border: 0; border-radius: 8px 8px 0 0; background: none; color: var(--term-dim); font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.term-tab[aria-selected="true"] { background: var(--term-line); color: var(--term-fg); }
.term-tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--term-green); }
.term-tab .dot.off { background: var(--term-dim); }
.term-tab .dot.wait { background: var(--term-yellow); }
.term-meta { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 14px; font-family: var(--f-mono); font-size: 11.5px; color: var(--term-dim); border-bottom: 1px solid var(--term-line); }
.term-body { flex: 1; overflow: auto; min-height: 0; padding: 12px 14px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; white-space: pre; }
.term-body .g { color: var(--term-green); } .term-body .y { color: var(--term-yellow); } .term-body .c { color: var(--term-cyan); }
.term-body .r { color: var(--term-red); } .term-body .d { color: var(--term-dim); } .term-body .k { color: var(--term-clay); }
.term-body .cursor { display: inline-block; width: 8px; height: 15px; background: var(--term-fg); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.term-in { display: flex; gap: 8px; align-items: center; padding: 8px 10px 8px 14px; border-top: 1px solid var(--term-line); }
.term-in span { font-family: var(--f-mono); font-size: 12.5px; color: var(--term-clay); }
.term-in input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--term-fg); font-family: var(--f-mono); font-size: 12.5px; }
.term-in input::placeholder { color: var(--term-dim); }
.term-in .kbd { font-family: var(--f-mono); font-size: 11px; color: var(--term-dim); border: 1px solid var(--term-line); border-radius: 5px; padding: 1px 6px; background: none; }
.term-note { padding: 0 14px 10px; font-size: 12px; color: var(--muted); max-width: 900px; }

/* Composer */
.dock { padding: 0 24px 18px; }
.dock .composer, .limit { max-width: 760px; margin-inline: auto; }
.composer { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 12px 10px 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.composer textarea { border: 0; outline: none; background: none; resize: none; min-height: 28px; max-height: 160px; font-size: 16px; line-height: 1.5; padding: 0; }
.composer textarea::placeholder { color: var(--faint); }
.composer label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.c-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.c-icon { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
.c-icon:hover { background: var(--hover); color: var(--ink); }
.folder { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--ink-2); font-size: 13px; min-width: 0; max-width: 220px; }
.folder span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folder:hover { background: var(--hover); }
.ctx { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px; border: 0; background: none; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; border-radius: 8px; }
.ctx:hover { background: var(--hover); color: var(--ink); }
.ring { width: 18px; height: 18px; }
.ring circle { fill: none; stroke-width: 3; }
.ring .track { stroke: var(--line); } .ring .val { stroke: var(--muted); }
.picker { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border-radius: 8px; border: 0; background: none; color: var(--ink-2); font-size: 14px; white-space: nowrap; min-width: 0; }
.picker:hover, .picker[aria-expanded="true"] { background: var(--hover); }
.picker .mark { width: 18px; height: 18px; font-size: 9.5px; border-radius: 5px; }
.picker .lbl { overflow: hidden; text-overflow: ellipsis; }
.picker .mdl { color: var(--muted); margin-left: 2px; }
.send { width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send:hover { background: var(--accent-strong); }
.send[disabled] { opacity: .45; cursor: default; }

/* Agent + model menu */

          <dl class="kv"><dt>tool_name</dt><dd><code>Bash</code></dd><dt>arguments</dt><dd><code>npx prisma migrate dev --name add_orders</code></dd><dt>status</dt><dd>success · exit 0</dd><dt>stdout_preview</dt><dd><code>Applied migration 20261015_add_orders</code></dd><dt>raw_log_path</dt><dd><code>~/.chorus/logs/exec_907.log</code> (6.2 KB, offloaded over 4 KB)</dd></dl>

          <h3>Order a cake page</h3>

      peer: `<div class="mem-list"><article class="card mem"><header>${mark('codex', 'xs')} Codex asked ${mark('claude', 'xs')} Claude Code · <code>ask_peer_agent</code><time>3:22 PM</time></header>

    }[S.memTab];
    return `<div class="main">${topbarHTML('')}<div class="pg"><div class="pg-inner">
      <div class="pg-title"><div><h2>Shared memory</h2><p>What every agent can see about this project. Stored in <code>~/.chorus/ledger.polodb</code>.</p></div></div>
      <div class="tiers">
        <div class="card tier"><h3>Pushed automatically</h3><p>Short text Chorus adds to an agent's prompt, so it starts informed. Each has a token budget.</p><div class="stores"><span class="chiplet">Handoff summaries · &lt;200 tokens</span><span class="chiplet">Skill index · &lt;100 tokens</span></div></div>
        <div class="card tier"><h3>Available on request</h3><p>Full records an agent fetches only when it needs them, through the <code>agent-bridge-mcp</code> tools.</p><div class="stores"><span class="chiplet">Turns</span><span class="chiplet">Tool runs</span><span class="chiplet">Artifacts</span><span class="chiplet">Peer questions</span></div></div>
      </div>
      <div class="seg" role="group" aria-label="Memory type" style="align-self:flex-start">${MEM_TABS.map(([k, l, c]) => `<button type="button" data-memtab="${k}" aria-pressed="${S.memTab === k}">${l} <span class="cnt">${c}</span></button>`).join('')}</div>
      ${body}
    </div></div></div>`;
  }

  /* ---------- Activity ---------- */
  const EVENTS = [
    { id: 'e1', t: '15:22:04', a: 'codex', type: 'mcp', name: 'ask_peer_agent', sum: 'Asked Claude Code about admin login (answered from memory)', st: 'ok', dur: '0.4s', tok: '—' },
    { id: 'e2', t: '15:21:40', a: 'codex', type: 'mcp', name: 'get_tool_execution', sum: 'exec_907 · tail 40 lines', st: 'ok', dur: '0.1s', tok: '—' },
    { id: 'e3', t: '15:20:12', a: 'codex', type: 'hook', name: 'handoff:inject', sum: 'Handoff summary from Claude Code (usage limit)', st: 'ok', dur: '—', tok: '138' },
    { id: 'e4', t: '15:19:58', a: 'claude', type: 'err', name: 'usage_limit', sum: 'Limit reached · resets 18:00 · parsed from transcript', st: 'bad', dur: '—', tok: '—' },
    { id: 'e5', t: '14:58:31', a: 'claude', type: 'tool', name: 'Bash', sum: 'npx prisma migrate dev --name add_orders', st: 'ok', dur: '6.8s', tok: '1.2k' },
    { id: 'e6', t: '14:57:02', a: 'claude', type: 'appr', name: 'PreToolUse', sum: 'Bash · held for approval → allowed by user after 1m29s', st: 'ok', dur: '89s', tok: '—' },
    { id: 'e7', t: '14:56:40', a: 'claude', type: 'tool', name: 'Edit', sum: 'prisma/schema.prisma (+9)', st: 'ok', dur: '0.2s', tok: '2.4k' },
    { id: 'e8', t: '14:47:12', a: 'claude', type: 'hook', name: 'PostToolUse', sum: 'Artifact registered: art_301 (html_preview)', st: 'ok', dur: '—', tok: '—' },
    { id: 'e9', t: '14:46:51', a: 'claude', type: 'tool', name: 'Bash', sum: 'node .agents/skills/phone-check/shot.mjs /order', st: 'ok', dur: '3.1s', tok: '0.6k' },
    { id: 'e10', t: '14:45:30', a: 'claude', type: 'tool', name: 'Bash', sum: 'npm run build', st: 'ok', dur: '14.2s', tok: '1.8k' },
    { id: 'e11', t: '14:41:03', a: 'claude', type: 'hook', name: 'SessionStart', sum: 'Skill index injected (84 tokens) · model sonnet', st: 'ok', dur: '—', tok: '84' },
    { id: 'e12', t: '14:30:22', a: 'codex', type: 'appr', name: 'PreToolUse', sum: 'shell rm -rf ./dist · waiting (Fix the contact form)', st: 'wait', dur: '—', tok: '—' }
  ];
  const DETAIL = {
    e6: { left: ['Hook input (stdin)', `{
  "session_id": "8f92a3c1",
  "hook_event_name": "PreToolUse",
  "tool_name": "Bash",
  "tool_input": {
    "command": "npx prisma migrate dev --name add_orders",
    "description": "Run migration add_orders"
  },
  "cwd": "/Users/me/Sites/sweet-crumb"
}`], right: ['Chorus decision (stdout)', `{
  "hookSpecificOutput": {
    "hookEventName": "PreToolUse",
    "permissionDecision": "allow",
    "permissionDecisionReason": "Allowed by user in Chorus"
  }
}
// risk: ask · category: database
// held 89s · hook timeout 600s`] },
    e5: { left: ['executions/exec_907', `{
  "_id": "exec_907",
  "turn_id": "turn_1049",
  "agent_id": "claude",
  "tool_name": "Bash",
  "arguments": { "command": "npx prisma migrate dev --name add_orders" },
  "status": "success",
  "exit_code": 0,
  "stdout_preview": "Applied migration 20261015_add_orders",
  "raw_log_path": "~/.chorus/logs/exec_907.log"
}`], right: ['Output (first lines)', 'Environment variables loaded from .env\nPrisma schema loaded from prisma/schema.prisma\nApplying migration `20261015_add_orders`\n\nThe following migration(s) have been applied:\n  migrations/20261015_add_orders/migration.sql\n\n✔ Generated Prisma Client in 412ms'] },
    e3: { left: ['Injected text (138 tokens)', '[Chorus handoff · from Claude Code · reason: usage limit]\nGoal: Customers can order a birthday cake online…\nDone: Order page + form… Orders table added.\nIn progress: Private Orders page…\nFiles: app/order/page.tsx, components/OrderForm.tsx, prisma/schema.prisma'], right: ['Delivery', '{\n  "target": "codex",\n  "model": "codex",\n  "method": "prepended_to_first_prompt",\n  "source_turns": ["turn_1048", "turn_1049"],\n  "budget": 200\n}'] },
    e4: { left: ['Transcript line', '{"type":"system","subtype":"error",\n "message":"Claude usage limit reached. Your limit will reset at 6pm."}'], right: ['Chorus action', 'Marked Claude Code as limited until 18:00\nShowed hand-off card in "Cake order page"\nCancelled 0 pending approvals'] }
  };
  function activityHTML() {
    const f = S.actFilter;
    const list = EVENTS.filter((e) => f === 'all' || e.a === f || e.type === f);
    const stCell = (s) => s === 'ok' ? '<span class="st-ok">ok</span>' : s === 'bad' ? '<span class="st-bad">error</span>' : '<span class="st-wait">waiting</span>';
    const rows = list.map((e) => {
      const sel = S.actSel === e.id; const d = DETAIL[e.id];
      return `<tr class="ev ${sel ? 'sel' : ''}" data-act="${e.id}" tabindex="0" aria-expanded="${sel}"><td class="t">${e.t}</td><td>${mark(e.a, 'xs')}</td><td><span class="etype ${e.type}">${e.type}</span></td><td><span class="mono">${e.name}</span></td><td class="sum">${esc(e.sum)}</td><td>${stCell(e.st)}</td><td class="num">${e.dur}</td><td class="num">${e.tok}</td></tr>
        ${sel ? `<tr class="detail"><td colspan="8">${d ? `<div class="detail-grid"><div><h4>${d.left[0]}</h4><pre class="json">${esc(d.left[1])}</pre></div><div><h4>${d.right[0]}</h4><pre class="json">${esc(d.right[1])}</pre></div></div>` : '<span class="note">Full record: the matching execution, hook payload and raw log.</span>'}
          <div class="btns" style="margin-top:10px"><button class="btn sm" type="button" data-toast="Copied as JSON.">${ic('copy', 'sm')} Copy JSON</button><button class="btn sm" type="button" data-toast="Opens the raw log file.">Open raw log</button><button class="btn sm btn-plain" type="button" data-open-term>Show in terminal</button></div></td></tr>` : ''}`;
    }).join('');
    const chip = (k, l) => `<button type="button" data-actf="${k}" aria-pressed="${f === k}">${l}</button>`;
    return `<div class="main">${topbarHTML('')}<div class="pg"><div class="pg-inner">
      <div class="pg-title"><div><h2>Activity</h2><p>Every tool call, hook, approval, MCP request and handoff, with the raw payloads. Today, all chats in <code>sweet-crumb</code>.</p></div>
        <button class="btn" type="button" data-toast="Exports the visible events as JSONL.">Export JSONL</button></div>
      <div class="stats">
        <div class="card stat"><b>62</b><span>tool calls · 1 failed</span></div>
        <div class="card stat"><b>2</b><span>approvals waiting</span></div>
        <div class="card stat"><b>3</b><span>handoffs · 388 tokens pushed</span></div>
        <div class="card stat"><b>214k</b><span>tokens · Claude 182k, Codex 32k</span></div>
      </div>
      <div class="filters">
        <div class="seg" role="group" aria-label="Agent">${chip('all', 'All')}${chip('claude', 'Claude Code')}${chip('agy', 'Antigravity')}${chip('codex', 'Codex')}</div>
        <div class="seg" role="group" aria-label="Type">${chip('tool', 'Tools')}${chip('hook', 'Hooks')}${chip('appr', 'Approvals')}${chip('mcp', 'MCP')}${chip('err', 'Errors')}</div>
      </div>
      <div class="log card"><table>
        <thead><tr><th>Time</th><th>Agent</th><th>Type</th><th>Name</th><th>Summary</th><th>Status</th><th style="text-align:right">Duration</th><th style="text-align:right">Tokens</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="note">No events match.</td></tr>'}</tbody>
      </table></div>
    </div></div></div>`;
  }

  /* ---------- Install modal ---------- */
  function installModalHTML() {
    const k = S.modalAgent, st = S.installStep;
    const n = (i) => st > i ? `<span class="stepnum done">${ic('check')}</span>` : `<span class="stepnum ${st === i ? 'now' : ''}">${i + 1}</span>`;
    return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="in-t">
      <div class="modal-head">${mark(k, 'lg')}<div><h3 id="in-t">${st > 2 ? `${AG[k].name} is ready` : `${AG[k].name} isn't installed yet`}</h3><p>${st > 2 ? 'You can use it in this chat and any other.' : `Chorus looked for the <code>${AG[k].cli}</code> command and didn't find it. Install it once and use it in any chat.`}</p></div>
        <button class="ghost-icon" type="button" data-close-modal aria-label="Close">${ic('x')}</button></div>
      <ol class="steps">
        <li>${n(0)}<div class="s"><strong>Install</strong>
          ${st > 0 ? '<p>Installed.</p>' : S.installing ? '<p>Installing… this takes about a minute.</p><div class="bar"><i id="ibar"></i></div>' : `
          <div class="btns"><button class="btn btn-accent" type="button" id="do-install">Install for me</button></div>
          <p>Or paste this into Terminal:</p>
          <div class="copyrow"><div class="code">${esc(AG[k].install)}</div><button class="c-icon" type="button" data-copy="${esc(AG[k].install)}" aria-label="Copy command">${ic('copy', 'sm')}</button></div>`}
        </div></li>
        <li>${n(1)}<div class="s"><strong>Sign in with ${AG[k].account}</strong><p>Runs <code>${AG[k].cli} login</code>, which opens the sign-in page in your browser.</p>
          ${st === 1 ? '<div class="btns"><button class="btn btn-accent" type="button" id="do-signin">Sign in</button></div>' : ''}</div></li>
        <li>${n(2)}<div class="s"><strong>Quick check</strong><p>${st === 2 ? 'Checking…' : st > 2 ? 'Version found, signed in, models listed.' : 'Chorus checks the version, sign-in, and available models.'}</p></div></li>
      </ol>
      <div class="btns">${st > 2 ? `<button class="btn btn-dark" type="button" data-use="${k}">Use ${AG[k].name}</button>` : `<button class="btn btn-plain" type="button" data-close-modal>Not now</button>`}</div>
    </div></div>`;
  }

  /* ---------- Render ---------- */
  function render() {
    $('#scenarios').innerHTML = SCN.map((s) => `<button class="scn" type="button" data-scn="${s.id}" aria-pressed="${s.id === S.scenario}"><small>${s.uc}</small>${s.label}</button>`).join('');
    const main = { skills: skillsHTML, memory: memoryHTML, activity: activityHTML }[S.view];
    const body = main ? main() : S.screen === 'home' ? homeHTML() : threadHTML();
    const modal = S.modal === 'install' ? installModalHTML() : S.modal === 'skill' ? skillModalHTML() : '';
    $('#root').innerHTML = `<div class="app">${sidebarHTML()}${body}${panelHTML()}</div>${modal}`;
    const t = $('#thread'); if (t && !S.keep) t.scrollTop = S.scenario === 'tools' ? 0 : t.scrollHeight;
    const tb = $('#term-body'); if (tb) tb.scrollTop = tb.scrollHeight;
    S.keep = false;
    if (S.installing) requestAnimationFrame(() => { const b = $('#ibar'); if (b) b.style.width = '100%'; });
  }
  const rerender = () => { S.keep = true; render(); };

  let tt;
  function toast(text) {
    let el = $('#toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); $('#window').appendChild(el); }
    el.textContent = text; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 2600);
  }

  function chooseAgent(k, model) {
    S.menu = false;
    if (!S.installed[k]) { S.modal = 'install'; S.modalAgent = k; S.installStep = 0; return rerender(); }
    if (model) S.model[k] = model;
    if (S.screen === 'thread' && k !== S.agent) {
      if (S.limited && !S.handedTo) return handoff(k);
      S.extra.push({ t: 'switch', to: k }); toast(`${AG[k].name} got a summary of this chat.`);
    } else if (model) toast(`${modelName(k, model)} will answer your next message.`);
    S.agent = k; render();
  }
  function handoff(k) { S.handedTo = k; S.agent = k; S.termTab = k; S.menu = false; render(); toast(`${AG[k].name} picked up where Claude Code left off.`); }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, tr.ev');
    let changed = false;
    if (S.menu && !e.target.closest('.menu') && !e.target.closest('#picker')) { S.menu = false; changed = true; }
    if (S.bell && !e.target.closest('.notif') && !e.target.closest('#bell') && !e.target.closest('[data-open-bell]')) { S.bell = false; S.focusNotif = null; changed = true; }
    if (!b) { if (changed) rerender(); return; }
    const d = b.dataset;
    if (d.scn) return reset(d.scn);
    if (d.act) { S.actSel = S.actSel === d.act ? null : d.act; return rerender(); }
    if (d.toast) { if (changed) rerender(); return toast(d.toast); }
    if (d.copy) { try { navigator.clipboard.writeText(d.copy).then(() => toast('Copied.'), () => toast('Select the command to copy it.')); } catch (_) { toast('Select the command to copy it.'); } return; }
    if (b.id === 'picker') { S.menu = !S.menu; S.menuAgent = S.agent; return rerender(); }
    if (d.agentRow) {
      const k = d.agentRow;
      if (!S.installed[k]) return chooseAgent(k);
      S.menuAgent = k; return rerender();
    }
    if (d.model) { const [k, m] = d.model.split(':'); return chooseAgent(k, m); }
    if (d.mode) { S.mode = d.mode; return render(); }
    if (d.termtab) { S.termTab = d.termtab; return rerender(); }
    if ('openTerm' in d) { S.view = 'chat'; S.screen = 'thread'; S.fresh = false; S.mode = 'terminal'; return render(); }
    if (b.id === 'bell') { S.bell = !S.bell; S.focusNotif = null; return rerender(); }
    if (d.openBell) { S.bell = true; S.focusNotif = d.openBell; return rerender(); }
    if (d.decide) {
      const [id, v] = d.decide.split(':'); const n = S.notifs.find((x) => x.id === id);
      if (v === 'confirm') { S.riskyConfirm = id; return rerender(); }
      n.status = v; S.riskyConfirm = null; rerender();
      return toast(v === 'allowed' ? `Allowed. ${AG[n.agent].name} is continuing.` : `${AG[n.agent].name} was told no and will suggest another way.`);
    }
    if ('unconfirm' in d) { S.riskyConfirm = null; return rerender(); }
    if ('readAll' in d) { S.notifs.forEach((n) => { n.unread = false; }); return rerender(); }
    if ('openChat' in d) { S.view = 'chat'; S.screen = 'thread'; S.fresh = false; S.mode = 'chat'; S.bell = false; return render(); }
    if ('newChat' in d) { S.view = 'chat'; S.screen = 'home'; S.fresh = false; S.mode = 'chat'; S.extra = []; S.artifact = null; S.agent = 'claude'; return render(); }
    if (d.view) { S.view = d.view; S.menu = false; return render(); }
    if (d.fill) { const p = $('#prompt'); p.value = d.fill; p.focus(); return; }
    if (b.id === 'tools-sum') { S.toolsOpen = !S.toolsOpen; return rerender(); }
    if (d.tool) { S.toolOpen[d.tool] = !S.toolOpen[d.tool]; return rerender(); }
    if (d.art) { S.artifact = d.art; S.artTab = 'preview'; return rerender(); }
    if (d.arttab) { S.artTab = d.arttab; return rerender(); }
    if ('closeArt' in d) { S.artifact = null; return rerender(); }
    if (d.handoff) return handoff(d.handoff);
    if ('closeModal' in d) { S.modal = null; S.installing = false; return rerender(); }
    if (b.id === 'do-install') { S.installing = true; rerender(); setTimeout(() => { S.installing = false; S.installStep = 1; rerender(); }, 1600); return; }
    if (b.id === 'do-signin') { toast('Opened the sign-in page in your browser.'); S.installStep = 2; rerender(); setTimeout(() => { S.installStep = 3; S.installed[S.modalAgent] = true; rerender(); }, 1200); return; }
    if (d.use) { S.modal = null; return chooseAgent(d.use); }
    if (b.id === 'sync-btn') { S.syncing = true; S.conflict = null; rerender(); setTimeout(() => { S.syncing = false; S.syncResult = true;
        if (!S.skills.find((s) => s.id === 'image-shrinker')) S.skills.push({ id: 'test-before-done', title: 'Test before done', desc: 'Run the tests before saying a task is finished.', origin: 'Imported from .codex/skills', on: false, files: 1, scripts: false }, { id: 'image-shrinker', title: 'Image shrinker', desc: 'Makes photos smaller before adding them to the site.', origin: 'Imported from .claude/skills', on: false, files: 2, scripts: true });
        rerender(); }, 1300); return; }
    if ('syncClose' in d) { S.syncResult = null; return rerender(); }
    if (d.conflict) { S.conflict = d.conflict; return rerender(); }
    if ('newSkill' in d) { S.modal = 'skill'; S.skillEdit = 'new'; S.skillFile = 0; return rerender(); }
    if (d.editSkill) { S.modal = 'skill'; S.skillEdit = 'db-migrate'; S.skillFile = 0; return rerender(); }
    if (d.skillFile) { S.skillFile = +d.skillFile; return rerender(); }
    if (d.memtab) { S.memTab = d.memtab; return rerender(); }
    if (d.actf) { S.actFilter = d.actf; S.actSel = null; return rerender(); }
    if (changed) rerender();
  });

  document.addEventListener('change', (e) => {
    const d = e.target.dataset;
    if (d.skillOn) { const s = S.skills.find((x) => x.id === d.skillOn); s.on = e.target.checked; rerender(); toast(s.on ? `Wrote .agents/skills/${s.id}. Agents see it from their next session.` : `Removed .agents/skills/${s.id}. Chorus keeps the files.`); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (S.modal) S.modal = null; S.menu = false; S.bell = false; rerender(); }
    if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'prompt') { e.preventDefault(); $('#composer').requestSubmit(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.ev')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'composer') {
      const p = $('#prompt'); const t = p.value.trim(); if (!t) { p.focus(); return; }
      if (S.screen === 'home') { S.screen = 'thread'; S.fresh = true; S.extra = []; }
      S.extra.push({ t: 'user', text: t }, { t: 'agent', agent: S.agent }); return render();
    }
    if (e.target.id === 'term-form') {
      const i = $('#term-input'); const t = i.value.trim(); if (!t) return;
      S.termExtra.push({ k: S.termTab, text: t }); S.extra.push({ t: 'user', text: t }, { t: 'agent', agent: S.termTab });
      render(); const ni = $('#term-input'); if (ni) ni.focus(); return;
    }
    if (e.target.id === 'skill-form') {
      const title = $('#sk-title').value.trim() || 'Untitled skill';
      const id = ($('#sk-name').value.trim() || title).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (S.skillEdit === 'new') S.skills.unshift({ id, title, desc: $('#sk-desc').value.trim() || 'No description yet.', origin: 'Created in Chorus', on: true, files: 1, scripts: false });
      S.modal = null; rerender(); toast(S.skillEdit === 'new' ? `Created ${title} and wrote .agents/skills/${id}.` : 'Saved. Rewrote the folder on disk.');
    }
  });

  reset('home');
})();
</script>
