# The Chorus box image, ghcr.io/chauvoluuhuong/chorus-box (docker/box/; plan docs/plans/2026-11-07-browser-everywhere-and-docker.md,
# part B), for linux/amd64 and linux/arm64. The AI CLIs in it are the newest versions in chorus-core's src/tested.json; Chorus itself
# is installed when the box starts, on the channel the user picks, so a Chorus release does not need a new image.
# Built and pushed, tagged `latest` and with the date:
#   - on a release tag (vX.Y.Z, vX.Y.Z-preview.N), so the box's entrypoint and launcher changes ship with the release
#   - when chorus-core's tested versions change: chorus-core sends repository_dispatch `tested-changed`, and a daily run catches
#     what a dispatch missed (it builds only when the versions differ from the image's)
#   - by hand (workflow_dispatch; `force` builds even when nothing changed)
# Needs the repository secret CHORUS_CORE_DEPLOY_KEY (the same read-only deploy key release.yml uses) to read tested.json.
name: Chorus box image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+']
  repository_dispatch:
    types: [tested-changed]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      core_ref:
        description: chorus-core branch, tag or commit to read src/tested.json from (default the CHORUS_CORE_REF variable, else dev)
        required: false
      force:
        description: build even when the tested versions are the image's already
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: chorus-box
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/chauvoluuhuong/chorus-box
  CORE_REF: ${{ inputs.core_ref || vars.CHORUS_CORE_REF || 'dev' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: chorus
      - name: Check out chorus-core (private; only src/tested.json is read)
        uses: actions/checkout@v5
        with:
          repository: chauvoluuhuong/chorus-core
          ref: ${{ env.CORE_REF }}
          ssh-key: ${{ secrets.CHORUS_CORE_DEPLOY_KEY }}
          path: chorus-core
          persist-credentials: false
          sparse-checkout: src/tested.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: v
        name: The newest tested CLI versions
        run: |
          pairs=$(node chorus/docker/box/tested.mjs chorus-core/src/tested.json)
          echo "$pairs"
          for p in $pairs; do echo "${p%%=*}=${p#*=}" >> "$GITHUB_OUTPUT"; done
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: need
        name: Anything new? (the daily run builds only when the versions changed)
        run: |
          if [ "${{ github.event_name }}" != schedule ] && [ "${{ github.event_name }}" != workflow_dispatch -o "${{ inputs.force }}" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          have=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{ json .Image }}' 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const i=j.config?j:Object.values(j)[0];const l=i.config.Labels||{};console.log([l["app.chorus.claude"],l["app.chorus.codex"],l["app.chorus.agy"]].join(" "))}catch{console.log("")}})')
          want="${{ steps.v.outputs.CLAUDE_VERSION }} ${{ steps.v.outputs.CODEX_VERSION }} ${{ steps.v.outputs.AGY_VERSION }}"
          echo "image has: '$have', tested: '$want'"
          [ "$have" = "$want" ] && echo "build=false" >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.need.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.need.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: chorus/docker/box
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_VERSION=${{ steps.v.outputs.CLAUDE_VERSION }}
            CODEX_VERSION=${{ steps.v.outputs.CODEX_VERSION }}
            AGY_VERSION=${{ steps.v.outputs.AGY_VERSION }}
          labels: |
            app.chorus.claude=${{ steps.v.outputs.CLAUDE_VERSION }}
            app.chorus.codex=${{ steps.v.outputs.CODEX_VERSION }}
            app.chorus.agy=${{ steps.v.outputs.AGY_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.need.outputs.build == 'true'
        name: Check both architectures start and carry the tested versions
        run: |
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --entrypoint bash "$IMAGE:latest" -c \
              'echo "$(uname -m): claude $(claude --version) · codex $(codex --version) · agy $(agy --version | head -1)"'
          done
