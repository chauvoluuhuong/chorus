# Release downloads: builds what `npm run release:downloads` builds by hand and attaches it to the GitHub Release v<version>.
#   chorus-cli-<v>.tgz, chorus-darwin-arm64-<v>.tar.gz, Chorus-macOS-<v>.zip   macOS arm64 runner (Tauri for the app)
#   chorus-linux-x64-<v>.tar.gz, chorus-linux-arm64-<v>.tar.gz                  Linux runners of each arch (Docker: Debian 11 for the
#                                                                               command, Ubuntu 22.04 for the window, desktop/chorus-desktop)
#   SHA256SUMS                                                                  over all of the above
# Two channels, both by tag (AGENTS.md, "Releases"; the build-app-workflow skill):
#   preview      a vX.Y.Z-preview.N tag, pushed after each dev → main merge. The version comes from the tag and is stamped into
#                the build only. Makes the prerelease of that tag and replaces the one rolling prerelease "preview" with the same
#                files, VERSION and SHA256SUMS: `install.sh --preview` installs from there.
#   production   a vX.Y.Z tag (after the owner approves that version), which must equal package.json's version. Makes the GitHub
#                Release vX.Y.Z (the latest one). The website is not touched here: `npm run release:fetch` and the chorus-admin
#                steps publish it.
# Run by hand it builds <package.json version>-dev.<run> as workflow artifacts only, no release.
#
# Needs the repository secret CHORUS_CORE_DEPLOY_KEY: the private half of a read-only deploy key of chauvoluuhuong/chorus-core.
# The core is checked out next to this repo (package.json depends on file:../chorus-core) and only its built dist/ goes into
# the downloads (scripts/release-downloads.mjs runs its check:pack). Nothing here prints or uploads the core's source.
name: Release downloads

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+']
  workflow_dispatch:
    inputs:
      core_ref:
        description: chorus-core branch, tag or commit to bundle (default the CHORUS_CORE_REF variable, else dev)
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CORE_REF: ${{ inputs.core_ref || vars.CHORUS_CORE_REF || 'dev' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "version=$pkg-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; echo "channel=none" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "channel=preview" >> "$GITHUB_OUTPUT"
          else
            [ "$GITHUB_REF_NAME" = "v$pkg" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"; exit 1; }
            echo "version=$pkg" >> "$GITHUB_OUTPUT"; echo "channel=production" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-15, targets: darwin-arm64, app: '--rebuild-app', upload: 'dl/*' }
          - { runner: ubuntu-24.04, targets: linux-x64, app: '--no-app', upload: 'dl/chorus-linux-x64-*.tar.gz' }
          - { runner: ubuntu-24.04-arm, targets: linux-arm64, app: '--no-app', upload: 'dl/chorus-linux-arm64-*.tar.gz' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: chorus
      - name: Check out chorus-core (private)
        uses: actions/checkout@v5
        with:
          repository: chauvoluuhuong/chorus-core
          ref: ${{ env.CORE_REF }}
          ssh-key: ${{ secrets.CHORUS_CORE_DEPLOY_KEY }}
          path: chorus-core
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install chorus-core
        working-directory: chorus-core
        run: npm ci --no-fund --no-audit --loglevel=error
      - name: Install chorus
        working-directory: chorus
        run: npm ci --no-fund --no-audit --loglevel=error
      # the Linux window's Rust toolchain and build folder (scripts/release-downloads.mjs linuxDesktop), after npm ci empties node_modules
      - if: startsWith(matrix.targets, 'linux')
        uses: actions/cache@v4
        with:
          path: chorus/node_modules/.cache/chorus-release/desktop-${{ matrix.targets }}
          key: desktop-${{ matrix.targets }}-${{ hashFiles('chorus/desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ matrix.targets }}-
      - if: matrix.app == '--rebuild-app'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.app == '--rebuild-app'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: chorus/desktop/src-tauri
      - if: matrix.app == '--rebuild-app'
        name: Install the Tauri CLI
        working-directory: chorus/desktop
        run: npm ci --no-fund --no-audit --loglevel=error
      - name: Stamp ${{ needs.version.outputs.version }}
        working-directory: chorus
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build ${{ matrix.targets }}
        working-directory: chorus
        run: node scripts/release-downloads.mjs --out=../dl --targets=${{ matrix.targets }} ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: dl-${{ matrix.targets }}
          path: ${{ matrix.upload }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, build]
    if: needs.version.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dl-*
          path: dl
          merge-multiple: true
      - name: Checksums
        working-directory: dl
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -la
      - name: Attach to the GitHub Release
        if: needs.version.outputs.channel == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dl/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            printf '%s\n' "Built by the release workflow from $GITHUB_SHA (chorus-core $CORE_REF)." "" \
              "Chorus.app is not signed or notarised yet. SHA256SUMS lists the checksum of every file." > notes.md
            gh release create "$TAG" dl/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Chorus ${TAG#v}" --notes-file notes.md --latest
          fi
      - name: The preview's prerelease, then the rolling preview
        if: needs.version.outputs.channel == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          echo "$V" > dl/VERSION
          printf '%s\n' "Preview $V, built from $GITHUB_SHA (chorus-core $CORE_REF)." "" \
            "Install the newest preview: curl -fsSL https://chorus-cli.web.app/install.sh | bash -s -- --preview" "" \
            "Not for everyday use: production releases are the vX.Y.Z releases. Chorus.app is not signed or notarised yet." > notes.md
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$V" dl/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$V" dl/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Chorus $V (preview)" --notes-file notes.md --prerelease --latest=false
          fi
          # "preview" always holds the newest preview tag; an older tag rebuilt by hand must not replace it
          newest=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" 'v*-preview.*' | sed -n 's#.*refs/tags/v\([^^]*\)$#\1#p' | sort -V | tail -1)
          [ "$newest" = "$V" ] || { echo "v$newest is newer than v$V: the rolling preview stays"; exit 0; }
          gh release delete preview --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create preview dl/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Chorus $V (preview)" --notes-file notes.md --prerelease --latest=false
