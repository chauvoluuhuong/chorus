[package]
name = "chorus-desktop"
version = "1.0.0"
description = "Chorus desktop: a native window over `chorus serve`"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
