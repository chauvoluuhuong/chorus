<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chorus</title>
<style>
  :root { --bg: #faf9f5; --ink: #141413; --muted: #6f6c64; --accent: #0f766e; --bad: #b13b32; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #262624; --ink: #f5f4ee; --muted: #a9a69c; --accent: #4fc1b6; --bad: #ee8a80; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  main { height: 100%; display: grid; place-items: center; text-align: center; }
  h1 { font: 400 30px/1.2 'Iowan Old Style', Georgia, serif; margin: 14px 0 6px; }
  .logo { display: inline-flex; gap: 4px; align-items: flex-end; height: 34px; }
  .logo i { display: block; width: 7px; border-radius: 2px; background: var(--accent); animation: up 1.1s ease-in-out infinite; }
  .logo i:nth-child(1) { height: 18px; } .logo i:nth-child(2) { height: 34px; animation-delay: 0.15s; } .logo i:nth-child(3) { height: 25px; animation-delay: 0.3s; }
  @keyframes up { 50% { transform: scaleY(0.6); transform-origin: bottom; } }
  p { color: var(--muted); margin: 0; }
  pre { display: none; text-align: left; max-width: 640px; white-space: pre-wrap; color: var(--bad); font: 12.5px/1.5 ui-monospace, Menlo, monospace; margin: 18px auto 0; }
</style>
</head>
<body>
<main><div><span class="logo"><i></i><i></i><i></i></span><h1>Chorus</h1><p id="msg">Starting chorus serve…</p><pre id="err"></pre></div></main>
<script>
  window.showError = msg => {
    document.getElementById('msg').textContent = 'Chorus could not start.';
    const e = document.getElementById('err');
    e.textContent = msg;
    e.style.display = 'block';
    for (const i of document.querySelectorAll('.logo i')) i.style.animation = 'none';
  };
</script>
</body>
</html>
